name: smart_travel_planner
description: "Smart Travel Itinerary Planner & Expense Splitter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  # State Management
  flutter_riverpod: ^2.6.1
  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Connectivity
  connectivity_plus: ^6.1.4
  # Internationalization & Formatting
  intl: ^0.20.2
  # Charts
  fl_chart: ^0.70.2
  # Routing
  go_router: ^14.8.1
  # UI Enhancements
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  # Utilities
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
